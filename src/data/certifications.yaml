# LES DATES, DESCRIPTIONS ET LIENS SONT À REMPLIR PAR MOI : ils valent
# « À compléter » ou sont vides tant que je ne les ai pas renseignés.
#
# Chaque entrée :
#   clé          : identifiant unique. Le numéro en tête fixe l'ordre
#                  d'affichage à l'intérieur de sa section.
#   nom          : intitulé exact de la certification
#   organisme    : qui la délivre
#   statut       : obtenue | en-cours | prevue
#   date         : mois d'obtention ou visé, par exemple 2026-03
#   description  : une phrase
#   verification : lien Credly ou page officielle de vérification,
#                  facultatif — le bouton « Vérifier » n'apparaît que
#                  si ce champ est rempli

