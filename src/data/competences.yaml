# Compétences affichées sur la page /competences.
#
# LES NIVEAUX SONT À REMPLIR PAR MOI : tous les `niveau` valent 50 par défaut,
# c'est une valeur provisoire sans signification. Mettre une valeur de 0 à 100.
#
# Les lignes de `details` marquées « à vérifier » sont des compétences
# attendues d'un BTS SIO option SISR, pré-remplies à titre de proposition :
# supprimer celles que je ne maîtrise pas, reformuler les autres.
#
# Chaque entrée :
#   clé          : identifiant unique. Le numéro en tête fixe l'ordre
#                  d'affichage : renuméroter pour réordonner la liste.
#   groupe       : competence | langue  (sépare les deux sections de la page)
#   categorie    : le nom affiché
#   niveau       : 0 à 100, affiché en barre et en chiffres
#   details      : compétences précises, affichées quand on déplie la ligne
#                  (catégories uniquement)
#
# Pour les langues, `niveau` est un texte libre (« Natif », « C1–C2 »),
# affiché tel quel : ni barre ni pourcentage.

